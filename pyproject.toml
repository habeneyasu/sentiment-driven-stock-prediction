[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | __pycache__
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = ["venv", ".venv", "__pycache__"]

[tool.pylint.messages_control]
disable = ["C0111", "R0903", "R0913"]

[tool.pylint.format]
max-line-length = 100

